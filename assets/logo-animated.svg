<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 15 64 34" width="256" height="136" role="img" aria-label="watchtop logo" xmlns:c2pa="http://c2pa.org/manifest">
  <title>watchtop</title>
  <style>
    /* 6-second loop: eye (iris + pupil) -> iris turns into the bar chart -> chart turns back into the eye. */
    .iris, .bar { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.4,0,.2,1); }

    /* The eye's iris: shrinks and fades out while the bars appear. */
    .iris { transform-box: fill-box; transform-origin: center; animation-name: iris; }
    @keyframes iris {
      0%,18%   { transform: scale(1);   opacity: 1; }
      30%,80%  { transform: scale(.2);  opacity: 0; }
      92%,100% { transform: scale(1);   opacity: 1; }
    }

    /* Bars grow from their bottom edge: small -> big, then shrink big -> small. */
    .bar { fill: #22D3EE; transform-box: fill-box; transform-origin: 50% 100%; }
    .b1 { animation-name: grow1; }
    .b2 { animation-name: grow2; }
    .b3 { animation-name: grow3; }
    @keyframes grow1 { 0%,24%{transform:scaleY(0)} 34%,76%{transform:scaleY(1)} 86%,100%{transform:scaleY(0)} }
    @keyframes grow2 { 0%,30%{transform:scaleY(0)} 40%,72%{transform:scaleY(1)} 81%,100%{transform:scaleY(0)} }
    @keyframes grow3 { 0%,36%{transform:scaleY(0)} 46%,68%{transform:scaleY(1)} 76%,100%{transform:scaleY(0)} }

    /* Animations off: show the finished chart. */
    @media (prefers-reduced-motion: reduce) {
      .iris, .bar { animation: none; }
      .iris { opacity: 0; }
    }
  </style>

  <!-- Eye outline -->
  <path fill="#22D3EE" fill-rule="evenodd" d="
    M 2 32 Q 32 0 62 32 Q 32 64 2 32 Z
    M 9 32 Q 32 9 55 32 Q 32 55 9 32 Z"/>

  <!-- Iris + pupil: only visible in the "eye" state -->
  <g class="iris" fill="#22D3EE">
    <circle cx="32" cy="32" r="8" fill="none" stroke="#22D3EE" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="3.2"/>
  </g>

  <!-- Chart bars: only visible in the "chart" state -->
  <rect class="bar b1" x="20" y="34" width="6" height="5"/>
  <rect class="bar b2" x="29" y="30" width="6" height="9"/>
  <rect class="bar b3" x="38" y="25" width="6" height="14"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
